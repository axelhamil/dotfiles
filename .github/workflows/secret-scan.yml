name: secret-scan

on:
  push:
  pull_request:

jobs:
  leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tree scan
        run: python3 scripts/check-leaks.py
      - name: Fixture + hook tests
        run: python3 scripts/test-leaks.py

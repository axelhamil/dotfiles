--ozone-platform=wayland
--enable-wayland-ime
# VaapiOnNvidiaGPUs : Chromium bloque VA-API sur NVIDIA en dur (crbug 1492880,
# toujours ouvert) ; ce flag est le seul qui lève le blocage. Mesuré : sans lui
# NVDEC reste a 0%, avec lui il monte a ~1% moyen / 3% pic sur du H.264 1080p30.
# AcceleratedVideoDecodeLinuxGL et VaapiIgnoreDriverChecks ne changent rien ici
# et le second est une source connue de crashs du process GPU : non retenus.
--enable-features=UseOzonePlatform,WaylandWindowDecorations,WaylandPerSurfaceScale,WaylandUiScale,VaapiOnNvidiaGPUs

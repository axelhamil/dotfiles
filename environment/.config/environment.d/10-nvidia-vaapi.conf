# Décodage vidéo matériel (NVDEC via VA-API) pour les applications lancées
# par systemd --user : walker/elephant passe par `uwsm app`, donc les
# applications n'héritent PAS des hl.env() de hyprland.lua — seules celles
# lancées directement par Hyprland les voient.
#
# Sans ces deux variables, libva ne sélectionne pas libva-nvidia-driver et
# Brave retombe sur un décodage logiciel.
LIBVA_DRIVER_NAME=nvidia
NVD_BACKEND=direct

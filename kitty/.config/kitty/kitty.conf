include current-theme.conf

font_family      FiraCode Nerd Font
bold_font        FiraCode Nerd Font Bold
italic_font      FiraCode Nerd Font Italic
bold_italic_font FiraCode Nerd Font Bold Italic
font_size 12.0
disable_ligatures never

cursor_trail 3
cursor_trail_decay 0.08 0.25

scrollback_lines 10000
scrollbar scrolled

repaint_delay 5
input_delay 0
sync_to_monitor yes

enable_audio_bell no
visual_bell_duration 0
window_alert_on_bell yes
bell_on_tab " "

remember_window_size yes
confirm_os_window_close 0
background_opacity 0.95
wayland_enable_ime no

shell_integration enabled
notify_on_cmd_finish unfocused 15.0 notify

allow_remote_control socket-only
listen_on unix:@kitty-{kitty_pid}
watcher watcher.py

enabled_layouts splits,stack
window_border_width 1pt
draw_minimal_borders yes
inactive_text_alpha 0.8
window_padding_width 2 6

tab_bar_edge top
tab_bar_style custom
tab_powerline_style slanted
tab_bar_min_tabs 1
tab_bar_margin_height 0 4
tab_title_template "{title}"
tab_title_max_length 60
tab_bar_filter session:~ or session:^$
active_tab_font_style bold
inactive_tab_font_style normal

map shift+enter send_text all \e\r

map kitty_mod+o launch --type=overlay --title=projects python3 ~/.config/kitty/scripts/projects.py
map kitty_mod+a launch --type=overlay --title=agents python3 ~/.config/kitty/scripts/agents.py
map kitty_mod+s goto_session --active-only
map kitty_mod+` goto_session -1
map kitty_mod+x close_session .

map kitty_mod+t new_tab_with_cwd
map kitty_mod+enter launch --location=hsplit --cwd=current
map kitty_mod+backslash launch --location=vsplit --cwd=current
map kitty_mod+f toggle_layout stack

map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right
map alt+shift+h move_window left
map alt+shift+j move_window down
map alt+shift+k move_window up
map alt+shift+l move_window right

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 99
map alt+tab goto_tab 0

map kitty_mod+up scroll_to_prompt -1
map kitty_mod+down scroll_to_prompt 1

# ──────────────────────────────────────────────────────────────
#  tmux.conf — Catppuccin Mocha (sans plugins)
# ──────────────────────────────────────────────────────────────

# ── Couleurs Catppuccin Mocha ─────────────────────────────────
# base      #1e1e2e    crust    #11111b    mantle   #181825
# surface0  #313244    surface1 #45475a    surface2 #585b70
# overlay0  #6c7086    overlay1 #7f849c    subtext0 #a6adc8
# text      #cdd6f4    lavender #b4befe    mauve    #cba6f7
# green     #a6e3a1    red      #f38ba8    yellow   #f9e2af
# blue      #89b4fa    peach    #fab387    rosewater#f5e0dc

# ── Réglages généraux ────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:Tc"
set -g default-shell /usr/bin/zsh
set -sg escape-time 50
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on

# ── Souris ───────────────────────────────────────────────────
set -g mouse on

# ── Keybindings ──────────────────────────────────────────────
# Prefix : Ctrl-b (défaut)

# Splits dans le répertoire courant
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigation panes (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Redimensionnement panes (repeat avec -r)
bind -r Left  resize-pane -L 5
bind -r Down  resize-pane -D 5
bind -r Up    resize-pane -U 5
bind -r Right resize-pane -R 5

# Fenêtres
bind c new-window -c "#{pane_current_path}"
bind -r C-h previous-window
bind -r C-l next-window

# Recharger la config
bind r source-file ~/.tmux.conf \; display-message "  Config rechargée"

# ── Copy mode (vi) ───────────────────────────────────────────
setw -g mode-keys vi

# v pour sélection, y pour copier vers clipboard Wayland
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel "wl-copy"

# Drag souris → copie automatique vers clipboard système
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# Coller depuis clipboard système
bind ] run-shell "wl-paste --no-newline | tmux load-buffer - && tmux paste-buffer"

# ── Status bar (position : haut) ─────────────────────────────
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Longueurs
set -g status-left-length 40
set -g status-right-length 60

# Gauche : icône session + nom
set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold]  #S #[fg=#cba6f7,bg=#1e1e2e,nobold]"

# Centre : justification des fenêtres
set -g status-justify centre

# Format fenêtre inactive
setw -g window-status-format "#[fg=#1e1e2e,bg=#313244]#[fg=#cdd6f4,bg=#313244] #I  #W #[fg=#313244,bg=#1e1e2e]"

# Format fenêtre active
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#a6e3a1]#[fg=#1e1e2e,bg=#a6e3a1,bold] #I  #W #[fg=#a6e3a1,bg=#1e1e2e,nobold]"

# Séparateur entre fenêtres
setw -g window-status-separator "  "

# Droite : horloge + date
set -g status-right "#[fg=#313244,bg=#1e1e2e]#[fg=#cdd6f4,bg=#313244]  %H:%M #[fg=#45475a,bg=#313244]#[fg=#cdd6f4,bg=#45475a]  %d/%m "

# ── Style visuel ─────────────────────────────────────────────
# Bordures panes
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"

# Messages
set -g message-style "bg=#45475a,fg=#b4befe"
set -g message-command-style "bg=#45475a,fg=#b4befe"

# Mode copie
setw -g mode-style "bg=#cba6f7,fg=#1e1e2e"

# Horloge
setw -g clock-mode-colour "#cba6f7"

# Pas d'assombrissement des panes inactifs
setw -g window-active-style "bg=default"
setw -g window-style "bg=default"

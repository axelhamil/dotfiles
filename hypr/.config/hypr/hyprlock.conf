# HYPRLOCK CONFIGURATION - Catppuccin Mocha

# GENERAL
general {
    disable_loading_bar = false
    hide_cursor = true
    grace = 0
    no_fade_in = false
    no_fade_out = false
}

# BACKGROUND
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.7
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = rgb(cba6f7)
    inner_color = rgb(1e1e2e)
    font_color = rgb(cdd6f4)
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Mot de passe...</i>
    hide_input = false
    rounding = 10
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_timeout = 2000
    fail_transition = 300
    capslock_color = rgb(fab387)
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -100
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgb(cba6f7)
    font_size = 90
    font_family = FiraCode Nerd Font Bold
    position = 0, 150
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgb(1e1e2e)
    shadow_boost = 1.2
}

# DATE
label {
    monitor =
    text = cmd[update:60000] echo "<span>$(date +"%A %d %B")</span>"
    color = rgb(cdd6f4)
    font_size = 24
    font_family = FiraCode Nerd Font
    position = 0, 50
    halign = center
    valign = center
}

# USER GREETING
label {
    monitor =
    text = Bonjour, $USER
    color = rgb(89b4fa)
    font_size = 18
    font_family = FiraCode Nerd Font
    position = 0, -200
    halign = center
    valign = center
}

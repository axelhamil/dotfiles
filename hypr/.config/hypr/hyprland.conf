
# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=DP-2, 3840x2160@60, 0x0, 1.5
monitor=HDMI-A-1, 2560x1080@60, 1660x-1080, 1
monitor=DP-1, disable

xwayland {
	force_zero_scaling = true
}

#MAIN
workspace=1,name:browser,monitor:DP-2,default:true
workspace=2,name:code,monitor:DP-2
workspace=3,name:terminal,monitor:DP-2
workspace=4,name:DB,monitor:DP-2

#RIGHT
workspace=5,name:chat,monitor:HDMI-A-1
workspace=6,name:music,monitor:HDMI-A-1
workspace=7,name:other,monitor:HDMI-A-1
workspace=8,name:whatever,monitor:HDMI-A-1

###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = nautilus
$menu = walker

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = hyprpm reload -n  # plugins hyprpm → deadlock sur ce setup
# focus DP-2 : déplacé en fin de séquence (les exec-once suivants volaient le focus)
exec-once = xrandr --output DP-2 --primary
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# exec-once = nm-applet  # doublon avec le module network de waybar
exec-once = waybar
exec-once = env QT_QPA_PLATFORMTHEME=qt5ct keepassxc --keyfile ~/.local/share/keepassxc/keyfile.keyx ~/Documents/secrets/passwords.kdbx --minimized

exec-once = awww-daemon
exec-once = until awww query &>/dev/null; do sleep 0.1; done; awww img ~/Images/wallpapers/l-art-numerique-avec-le-paysage-urbain-et-l-architecture.jpg --transition-type none

# Walker (service mode — instant launch)
exec-once = walker --gapplication-service

# Scratchpads
exec-once = [workspace special:term silent] kitty --class scratch-term
exec-once = [workspace special:files silent] nautilus

# Scratchpad music (preload pour ouverture instantanée)
exec-once = [workspace special:music silent] cider

# Notifications
exec-once = swaync

# Idle/Lock
exec-once = hypridle

# Clipboard manager
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Focus initial — DOIT rester le dernier exec-once : les scratchpads,
# keepassxc et cider volent le focus s'ils démarrent après.
exec-once = sleep 4; hyprctl dispatch focusmonitor DP-2; hyprctl dispatch workspace 1

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = XCURSOR_THEME,catppuccin-mocha-mauve-cursors
env = HYPRCURSOR_SIZE,24
env = HYPRCURSOR_THEME,catppuccin-mocha-mauve-cursors

# Qt theming (qt6ct -> Kvantum/Catppuccin)
env = QT_QPA_PLATFORMTHEME,qt6ct

# NVIDIA Wayland
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = GBM_BACKEND,nvidia-drm
env = GSK_RENDERER,ngl


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 2
    gaps_out = 2, 8, 8, 8

    border_size = 2

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgb(cba6f7) rgb(89b4fa) 45deg
    col.inactive_border = rgba(313244cc)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 14
    rounding_power = 3.0

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = true
    dim_strength = 0.12

    shadow {
        enabled = true
        range = 30
        render_power = 2
        color = rgba(00000055)
        offset = 0 6
    }

    blur {
        enabled = false
        size = 6
        passes = 2
        xray = false
        vibrancy = 0.15
        vibrancy_darkness = 0.2
        noise = 0.008
        contrast = 0.95
        brightness = 1.05
    }
}

#####################
### LAYER RULES ###
#####################

layerrule {
    name = blur-waybar
    match:namespace = ^(waybar)$
    blur = true

}

layerrule {
    name = blur-walker
    match:namespace = ^(walker)$
    blur = true

}

layerrule {
    name = blur-notifications
    match:namespace = ^(notifications)$
    blur = true

}

layerrule {
    name = blur-wofi
    match:namespace = ^(wofi)$
    blur = true

}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Apple motion design — critically damped springs
    # macOS utilise des springs avec très peu d'overshoot et une décélération longue
    bezier = appleSpring,  0.22, 1.0,  0.36, 1.0
    bezier = appleSlow,    0.25, 1.0,  0.32, 1.0
    bezier = appleFast,    0.2,  0.9,  0.1,  1.0
    bezier = appleSettle,  0.12, 0.96, 0.26, 1.0

    # Fenêtres — scale up doux comme Mission Control
    animation = windows,     1, 7, appleSpring,  popin 92%
    animation = windowsOut,  1, 5, appleSlow,    popin 92%
    animation = windowsMove, 1, 6, appleSettle

    # Fade — lent et délibéré
    animation = fade,       1, 6, appleSlow
    animation = fadeIn,     1, 5, appleSlow
    animation = fadeOut,    1, 5, appleSlow
    animation = fadeShadow, 1, 6, appleSlow
    animation = fadeDim,    1, 6, appleSlow

    # Layers — fade au lieu de slide (comme macOS)
    animation = layers,    1, 5, appleSlow,   fade
    animation = layersIn,  1, 4, appleSpring, fade
    animation = layersOut, 1, 4, appleSlow,   fade

    # Workspaces — slidefadevert doux
    animation = workspaces,    1, 6, appleSettle, slidefadevert 15%
    animation = workspacesIn,  1, 6, appleSettle, slidefadevert 15%
    animation = workspacesOut, 1, 5, appleSlow,   slidefadevert 15%

    # Scratchpads — drop contrôlé
    animation = specialWorkspace, 1, 7, appleSettle, slidefadevert -40%

    # Bordure — transition douce sur focus
    animation = border, 1, 8, appleSlow
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vrr = 1
}


#############
### INPUT ###
#############

input {
    kb_layout = fr
    kb_variant =
    kb_model =
    kb_options = caps:escape
    kb_rules =

    repeat_rate = 60
    repeat_delay = 250

    accel_profile = flat

    follow_mouse = 1

    sensitivity = 0.15 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod, Q, killactive,
bind = $mainMod CTRL SHIFT, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, Space, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, T, layoutmsg, togglesplit # dwindle

# Lockscreen (SHIFT pour éviter conflit avec vim-style focus)
bind = $mainMod CTRL, L, exec, hyprlock

# Clipboard
bind = $mainMod, C, exec, walker -m clipboard
bind = $mainMod SHIFT, C, exec, cliphist wipe

# KeePassXC toggle (focus ou lance)
bind = $mainMod SHIFT, K, exec, hyprctl dispatch focuswindow class:org.keepassxc.KeePassXC || keepassxc

# Color picker
bind = $mainMod SHIFT, P, exec, hyprpicker -a

# Wallpaper random
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/scripts/wallpaper.sh

# Screenshots (grimblast + swappy) - style macOS
bind = $mainMod SHIFT, S, exec, grimblast --notify copy area
bind = $mainMod SHIFT ALT, S, exec, grimblast --notify save area - | swappy -f -
bind = $mainMod SHIFT CTRL, S, exec, grimblast --notify copy screen
bind = $mainMod SHIFT ALT, A, exec, grimblast --notify copy active

# Dictée vocale (Voxtype push-to-talk)
bind = $mainMod SHIFT, D, exec, voxtype record start
bindr = $mainMod SHIFT, D, exec, voxtype record stop

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Vim-style focus
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Move window
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Vim-style move window
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, code:10, workspace, 1
bind = $mainMod, code:11, workspace, 2
bind = $mainMod, code:12, workspace, 3
bind = $mainMod, code:13, workspace, 4
bind = $mainMod, code:14, workspace, 5
bind = $mainMod, code:15, workspace, 6
bind = $mainMod, code:16, workspace, 7
bind = $mainMod, code:17, workspace, 8
bind = $mainMod, code:18, workspace, 9
bind = $mainMod, code:19, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, code:10, movetoworkspace, 1
bind = $mainMod SHIFT, code:11, movetoworkspace, 2
bind = $mainMod SHIFT, code:12, movetoworkspace, 3
bind = $mainMod SHIFT, code:13, movetoworkspace, 4
bind = $mainMod SHIFT, code:14, movetoworkspace, 5
bind = $mainMod SHIFT, code:15, movetoworkspace, 6
bind = $mainMod SHIFT, code:16, movetoworkspace, 7
bind = $mainMod SHIFT, code:17, movetoworkspace, 8
bind = $mainMod SHIFT, code:18, movetoworkspace, 9
bind = $mainMod SHIFT, code:19, movetoworkspace, 10

# ── Scratchpads ──
bind = $mainMod, S, togglespecialworkspace, term
bind = $mainMod, F2, togglespecialworkspace, files
bind = $mainMod, F3, togglespecialworkspace, music

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class ^.*$

# Fix some dragging issues with XWayland
windowrule {
    name = xwayland-drag-fix
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# ── Waybar Popups (top-right modal, close on focus loss) ──
windowrule = float on, match:class ^(blueman-manager)$
windowrule = move 72% 3.5%, match:class ^(blueman-manager)$
windowrule = size 700 550, match:class ^(blueman-manager)$

windowrule = float on, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = move 72% 3.5%, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = size 700 550, match:class ^(org.pulseaudio.pavucontrol)$

windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = move 72% 3.5%, match:class ^(nm-connection-editor)$
windowrule = size 700 550, match:class ^(nm-connection-editor)$

windowrule = float on, match:class ^(popup-nmtui)$
windowrule = move 72% 3.5%, match:class ^(popup-nmtui)$
windowrule = size 700 550, match:class ^(popup-nmtui)$

windowrule = float on, match:class ^(helvum)$
windowrule = move 72% 3.5%, match:class ^(helvum)$
windowrule = size 900 600, match:class ^(helvum)$

# Keepassxc
windowrule = float on, match:class ^(org.keepassxc.KeePassXC)$
windowrule = center on, match:class ^(org.keepassxc.KeePassXC)$
windowrule = size 800 600, match:class ^(org.keepassxc.KeePassXC)$

# Nautilus
windowrule = float on, match:class ^(org.gnome.Nautilus)$
windowrule = center on, match:class ^(org.gnome.Nautilus)$
windowrule = size 900 600, match:class ^(org.gnome.Nautilus)$

# Steam
windowrule = float on, match:class ^(steam)$
windowrule = center on, match:class ^(steam)$, match:title ^(Steam)$
windowrule = size 1200 800, match:class ^(steam)$, match:title ^(Steam)$


# ── Scratchpad: Terminal (drop-down) ──
windowrule = float on, match:class ^(scratch-term)$
windowrule = size 80% 60%, match:class ^(scratch-term)$
windowrule = move 10% 5%, match:class ^(scratch-term)$

# ── Scratchpad: File Manager ──
windowrule = float on, match:class ^(scratch-files)$
windowrule = size 70% 70%, match:class ^(scratch-files)$
windowrule = center on, match:class ^(scratch-files)$

# ── Scratchpad: Music (Cider) ──
windowrule = float on, match:class ^(Cider)$
windowrule = size 70% 70%, match:class ^(Cider)$
windowrule = center on, match:class ^(Cider)$


